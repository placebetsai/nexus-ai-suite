<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" color="#F4F2EE" role="img" aria-labelledby="cs-set-t cs-set-d">
  <title id="cs-set-t">CreateStuff icon set</title>
  <desc id="cs-set-d">Twelve 24 pixel stroke icons: database, key, globe, terminal, layers, git branch, box, code, link, preview, cpu, sliders. Use with a symbol reference such as assets/createstuff-icons.svg#cs-database.</desc>

  <symbol id="cs-database" viewBox="0 0 24 24">
