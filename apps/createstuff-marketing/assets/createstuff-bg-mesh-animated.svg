<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="cs-mesh-a-t cs-mesh-a-d">
  <title id="cs-mesh-a-t">CreateStuff animated mesh background</title>
  <desc id="cs-mesh-a-d">The dark mesh gradient with a slow drifting violet and azure glow. Reads as a still frame with animation disabled.</desc>
  <defs>
    <linearGradient id="csma-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B12"/>
      <stop offset="0.55" stop-color="#0E0D17"/>
      <stop offset="1" stop-color="#141221"/>
    </linearGradient>
    <radialGradient id="csma-violet">
      <stop offset="0" stop-color="#7559D9" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#7559D9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7559D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="csma-azure">
      <stop offset="0" stop-color="#4CC2FF" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#4CC2FF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#4CC2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="csma-deep">
      <stop offset="0" stop-color="#B14BD8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#B14BD8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="csma-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#3B3556" fill-opacity="0.85"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#csma-base)"/>
  <rect width="1600" height="900" fill="url(#csma-dots)" opacity="0.75"/>
  <ellipse cx="300" cy="230" rx="660" ry="520" fill="url(#csma-violet)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 120 70; 0 0" dur="26s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1400" cy="740" rx="600" ry="470" fill="url(#csma-azure)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -95 -55; 0 0" dur="30s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1150" cy="70" rx="440" ry="330" fill="url(#csma-deep)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -70 60; 0 0" dur="22s" repeatCount="indefinite"/>
  </ellipse>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5">
    <path d="M0 660C420 560 700 760 1120 640C1330 580 1470 600 1600 560"/>
    <path d="M0 720C420 620 700 820 1120 700C1330 640 1470 660 1600 620"/>
  </g>
</svg>
