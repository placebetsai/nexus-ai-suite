<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1b1f">
<title>Fashionistas — AI Closet & Resale Studio</title>
<meta name="description" content="Snap a photo, AI identifies your item, cross-list to Depop, eBay, Poshmark, Mercari, Vinted, Grailed, track orders and profit.">
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#1b1b1f; --mut:#7a7a82; --line:#e7e0d6;
  --accent:#b3471f; --accent2:#7d2d12; --good:#1f7a4d; --bad:#c0392b; --gold:#c8860a;
  --shadow:0 8px 28px rgba(30,20,10,.08);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;margin:.2em 0}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 18px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .06s,filter .15s;margin:4px 0}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ink);color:#fff;width:100%}
.btn-accent{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn-soft{background:#eee9e0;color:var(--ink)}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{padding:9px 13px;font-size:13.5px;border-radius:11px}
.input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;font-size:15px;background:#fff;color:var(--ink);outline:none}
.input:focus{border-color:var(--ink)}
label{font-size:12.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:block;margin:14px 0 5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:12px 0;box-shadow:var(--shadow)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:99;opacity:0;transition:opacity .25s;max-width:86%;text-align:center}
.toast.show{opacity:.95}
.spinner{border:3px solid rgba(0,0,0,.12);border-top-color:var(--ink);border-radius:50%;width:26px;height:26px;animation:sp .7s linear infinite;margin:22px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.img{width:100%;height:auto;border-radius:14px;object-fit:cover}
.pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700;background:#eee9e0;color:var(--ink);margin:2px 3px 2px 0}
.mut{color:var(--mut);font-size:13px}
.badge{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55));border-radius:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gitem{position:relative;background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}
.gitem img{width:100%;height:170px;object-fit:cover;display:block}
.gitem .meta{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 9px;color:#fff}
.gitem .t{font-weight:800;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.gitem .p{font-weight:700;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.hero{border-radius:22px;overflow:hidden;color:#fff;position:relative;background:radial-gradient(120% 160% at 85% -20%,#6b2d13 0%,#1b1b1f 62%);padding:26px 22px;margin:6px 0 18px;box-shadow:var(--shadow)}
.hero h1{font-size:26px;margin:0 0 4px}
.hero p{margin:0;color:#d8cfc2;font-size:14px}
.stat b{font-size:24px;display:block;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.chip{display:inline-block;padding:6px 13px;border-radius:999px;border:1.4px solid var(--line);font-size:13px;font-weight:600;background:#fff;margin:3px 4px 3px 0;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:6px 4px}
td{padding:7px 4px;border-top:1px solid var(--line)}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}
nav.tabbar a{flex:1;text-align:center;padding:7px 0 5px;font-size:10px;font-weight:700;color:var(--mut);text-decoration:none;letter-spacing:.02em}
nav.tabbar a svg{display:block;margin:0 auto 3px}
nav.tabbar a.on{color:var(--accent)}
.upload-zone{border:2px dashed var(--line);border-radius:var(--radius);padding:34px 16px;text-align:center;color:var(--mut);cursor:pointer;background:#fff;transition:.15s}
.upload-zone.hot{border-color:var(--accent);background:#fdf1ea}
.detail-img{max-height:260px;width:100%;object-fit:contain;background:#f1ece4;border-radius:14px}
.conf{color:var(--good);font-weight:800}
.tier{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}
bar{display:block;height:6px;border-radius:99px;background:#eee9e0;margin-top:6px;overflow:hidden}
bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
code{background:#f1ece4;padding:2px 6px;border-radius:6px;font-size:12px}
a.link{color:var(--accent);font-weight:700;text-decoration:none}
.sheet{position:fixed;inset:0;background:rgba(15,10,5,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet .body{background:var(--bg);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:up .18s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.req i{display:inline-block;font-style:normal;font-weight:800;font-size:12px;background:var(--gold);color:#fff;border-radius:5px;padding:1px 6px;margin-right:5px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.empty b{display:block;font-size:40px;margin-bottom:8px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.tag.active{background:#e2efe7;color:var(--good)}
.tag.sold{background:#fbe4e1;color:var(--bad)}
footer{color:var(--mut);font-size:12px;text-align:center;padding:22px 0 8px}
</style>
</head>
<body>
<div class="wrap">

  <!-- ================= AUTH ================= -->
  <section id="view-auth" class="hidden">
    <div class="hero" style="margin-top:8px">
      <h1>Fashionistas.ai</h1>
      <p>Snap a photo. The AI sizes up the item, suggests a price, and cross-lists it to Depop, eBay, Poshmark, Mercari, Vinted & Grailed.</p>
    </div>
    <div style="display:flex;gap:10px;margin:16px auto 4px;justify-content:center">
      <button class="chip on" id="auth-tab-login">Log in</button>
      <button class="chip" id="auth-tab-signup">Create account</button>
    </div>
    <div class="card">
      <div id="auth-login">
        <label>Username</label>
        <input class="input" id="login-u" placeholder="your username" autocomplete="username">
        <label>Password</label>
        <input class="input" id="login-p" type="password" placeholder="password" autocomplete="current-password">
        <div style="height:14px"></div>
        <button class="btn btn-primary" onclick="doLogin()">Log in</button>
      </div>
      <div id="auth-signup" class="hidden">
        <label>Username</label>
        <input class="input" id="su-u" placeholder="3+ characters">
        <label>Email</label>
        <input class="input" id="su-e" type="email" placeholder="you@example.com">
        <label>Password</label>
        <input class="input" id="su-p" type="password" placeholder="6+ characters">
        <div style="height:14px"></div>
        <button class="btn btn-accent" onclick="doSignup()">Create free account</button>
        <p class="mut" style="font-size:12px;margin-top:10px">Data and images persist in Cloudflare D1 + R2. No credit card needed.</p>
      </div>
    </div>
    <div class="card" style="text-align:center">
      <p class="mut" style="margin:0 0 6px">Try it instantly with the demo account</p>
      <button class="btn btn-soft btn-sm" onclick="demoLogin()">Log in as demo seller</button>
    </div>
  </section>

  <!-- ================= APP CORE ================= -->
  <section id="view-app" class="hidden">
    <div id="topbar" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <div>
        <h2 id="view-title" style="margin:0;font-size:22px">Closet</h2>
        <span class="mut" id="view-sub"></span>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sign out</button>
    </div>
    <div id="screen"></div>
  </section>

</div>

<!-- toast -->
<div class="toast" id="toast"></div>

<!-- bottom tabs -->
<nav class="tabbar hidden" id="tabbar">
  <a data-v="home" href="javascript:go('home')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21h-6v-6h-6v6H3z"/></svg>Home</a>
  <a data-v="closet" href="javascript:go('closet')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 3h16v18H4zM9 3v18M9 8h6"/></svg>Closet</a>
  <a data-v="snap" href="javascript:go('snap')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M3 8h3.2L9 4h6l2.8 4H21a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/></svg>Snap</a>
  <a data-v="sell" href="javascript:go('sell')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M14.5 9.5c-.6-1-1.6-1.5-2.5-1.5s-1.9.5-1.9 1.4c0 2 4.4 1.2 4.4 3.2 0 1-.9 1.4-2.5 1.4-1 0-2-.5-2.5-1.5"/></svg>Sell</a>
  <a data-v="more" href="javascript:go('more')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</a>
</nav>

<script>
const API = "https://fashionistas-api.fashionistas1979.workers.dev";
let TOKEN = localStorage.getItem("fash_token") || "";
let USER = JSON.parse(localStorage.getItem("fash_user") || "null");
let S = { listings: [], orders: [], items: [] };
let CURRENT = {};

const $ = (s) => document.querySelector(s);
const view = (name) => { document.querySelectorAll("body > section[id^=view-], nav.tabbar").forEach(el => el.classList.toggle("hidden", el.id !== "view-"+name && el.id !== "tabbar")); };
const toast = (m, ms=2200) => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), ms); };
const money = (n) => "$" + (Number(n)||0).toFixed(n % 1 === 0 ? 0 : 2);
const fmt = (d) => { if(!d) return ""; const x = new Date(d); return isNaN(x) ? d : x.toLocaleDateString(undefined,{month:"short",day:"numeric"}); };

function showLoader(html) { return `<div class="card"><div class="spinner"></div>${html||""}</div>`; }

async function api(path, opts={}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers||{}) };
  if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
  const r = await fetch(API + path, { ...opts, headers });
  let d = null; try { d = await r.json(); } catch {}
  if (r.status === 401) { toast("Session expired — please log in"); setTimeout(()=>logout(), 600); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error(d?.error || "Request failed (" + r.status + ")");
  return d;
}

/* ================= AUTH ================= */
function demoLogin(){ $("#login-u").value = "demo"; $("#login-p").value = "DemoPass123"; doLogin(); }
async function doLogin(){
  const u = $("#login-u").value.trim(), p = $("#login-p").value;
  if (!u || !p) return toast("Enter username and password");
  try {
    const d = await api("/api/auth/login", { method:"POST", body: JSON.stringify({ username:u, password:p }) });
    afterAuth(d);
  } catch(e){ toast(e.message); }
}
async function doSignup(){
  const u = $("#su-u").value.trim(), e = $("#su-e").value.trim(), p = $("#su-p").value;
  if (u.length < 3) return toast("Username needs 3+ characters");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return toast("Enter a valid email");
  if (p.length < 6) return toast("Password needs 6+ characters");
  try {
    const d = await api("/api/auth/register", { method:"POST", body: JSON.stringify({ username:u, email:e, password:p }) });
    afterAuth(d);
  } catch(e){ toast(e.message); }
}
function afterAuth(d){ TOKEN = d.token; USER = d.user; localStorage.setItem("fash_token", TOKEN); localStorage.setItem("fash_user", JSON.stringify(USER)); $("#view-auth").classList.add("hidden"); $("#view-app").classList.remove("hidden"); $("#tabbar").classList.remove("hidden"); go("home"); }
function logout(){ TOKEN = ""; USER = null; localStorage.removeItem("fash_token"); localStorage.removeItem("fash_user"); $("#view-app").classList.add("hidden"); $("#tabbar").classList.add("hidden"); $("#view-auth").classList.remove("hidden"); }

/* ================= NAV ================= */
const TITLES = { home:["Studio","your resale command center"], closet:["My Closet","every item you own or sell"], snap:["Snap & Sell","AI identifies your item in seconds"], sell:["Sell Smarter","pricing, fees, cross-listing tools"], more:["More","orders, analytics, hauls, export"] };
async function go(v){
  document.querySelectorAll("nav.tabbar a").forEach(a => a.classList.toggle("on", a.dataset.v === v));
  const [t, sub] = TITLES[v] || ["",""];
  $("#view-title").textContent = t; $("#view-sub").textContent = sub;
  const el = $("#screen");
  if (v === "home") return renderHome(el);
  if (v === "closet") return renderCloset(el);
  if (v === "snap") return renderSnap(el);
  if (v === "sell") return renderSell(el);
  if (v === "more") return renderMore(el);
}

/* ================= HOME ================= */
async function renderHome(el){
  el.innerHTML = showLoader();
  try {
    const [a, p, mp] = await Promise.all([ api("/api/analytics"), api("/api/profit/summary"), api("/api/marketplaces") ]);
    S.markets = mp.marketplaces;
    const st = a.stats || {};
    el.innerHTML = `
      <div class="hero">
        <h1>Hey ${USER.username} 👋</h1>
        <p>${st.activeListings||0} live listings · ${st.sales||0} sales · ${money(st.profit)} net profit</p>
      </div>
      <div class="three">
        <div class="card" style="margin:0;text-align:center"><div class="stat"><b>${st.activeListings||0}</b><span>Listings</span></div></div>
        <div class="card" style="margin:0;text-align:center"><div class="stat"><b>${st.sales||0}</b><span>Sales</span></div></div>
        <div class="card" style="margin:0;text-align:center"><div class="stat"><b>${money(st.profit)}</b><span>Profit</span></div></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0">Revenue · last 30 days</h3>
        ${await revenueChart(a.byDay||[])}
      </div>
      <div class="card">
        <h3 style="margin-top:0">Revenue by platform</h3>
        ${renderPlatforms(a.byPlatform||[])}
      </div>
      <div class="card">
        <h3 style="margin-top:0">Quick actions</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
          <button class="btn btn-accent" onclick="go('snap')">📸 Snap a new item</button>
          <button class="btn btn-soft" onclick="go('closet')">🗂️ Browse closet</button>
          <button class="btn btn-soft" onclick="openAdd()">➕ Add manually</button>
          <button class="btn btn-soft" onclick="go('sell')">⚖️ Pricing & fees</button>
        </div>
      </div>`;
  } catch(e){ el.innerHTML = `<div class="empty"><b>⚠️</b>${escapeHtml(e.message)}</div>`; }
}
async function revenueChart(days){
  if (!days.length) return `<p class="mut">No sales yet — snap your first item and cross-list it.</p>`;
  const max = Math.max(...days.map(d=>d.rev||0), 1);
  const bars = days.slice(-14).map(d=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><bar style="width:100%;margin:0"><i style="height:${Math.max(4,((d.rev||0)/max)*100)}%;min-height:4px"></i></bar><span class="mut" style="font-size:9.5px">${fmt(d.d)}</span></div>`).join("");
  return `<div style="display:flex;gap:6px;align-items:flex-end;height:110px">${bars}</div>`;
}
function renderPlatforms(rows){
  if (!rows.length) return `<p class="mut">Cross-listed sales will appear here per platform.</p>`;
  return rows.map(r=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)"><b>${r.platform||"other"}</b><span class="mut">${r.c} sales · ${money(r.rev)}</span></div>`).join("");
}

/* ================= CLOSET ================= */
async function renderCloset(el){
  el.innerHTML = showLoader();
  try {
    const d = await api("/api/listings");
    S.listings = d.listings || [];
    await loadMarketplaces();
    if (!S.listings.length) {
      el.innerHTML = `<div class="empty"><b>🛍️</b>Your closet is empty.<br><br><button class="btn btn-accent" onclick="go('snap')">Snap your first item</button> <button class="btn btn-soft" onclick="openAdd()">Add manually</button></div>`;
      return;
    }
    el.innerHTML = `
      <input class="input" id="closet-search" placeholder="Search your closet…" oninput="filterCloset(this.value)" style="margin-bottom:10px">
      <div class="grid" id="closet-grid">${S.listings.map(liGrid).join("")}</div>`;
  } catch(e){ el.innerHTML = `<div class="empty"><b>⚠️</b>${escapeHtml(e.message)}</div>`; }
}
function liGrid(l){
  const cat = l.category || "item";
  return `<div class="gitem" onclick="openListing(${l.id})">
    ${l.photo_url ? `<img loading="lazy" src="${l.photo_url}" onerror="this.remove()"><div class="badge"></div>` : `<div style="height:170px;background:linear-gradient(135deg,#f3ede4,#e4d9ca);display:flex;align-items:center;justify-content:center;font-size:38px">${catEmoji(cat)}</div>`}
    <div class="meta"><div class="t">${escapeHtml(l.title||"Untitled")}</div><div class="p">${money(l.price)} <span class="tag ${l.status==='sold'?'sold':'active'}" style="margin-left:4px">${l.status||"active"}</span></div></div>
  </div>`;
}
function filterCloset(q){
  q = q.toLowerCase();
  const filtered = S.listings.filter(l=>((l.title||"")+(l.description||"")+(l.brand||"")).toLowerCase().includes(q));
  $("#closet-grid").innerHTML = filtered.length ? filtered.map(liGrid).join("") : `<div class="empty"><b>🔍</b>No matches</div>`;
}
const catEmoji = (c)=>({Tops:"👕",Bottoms:"👖",Dresses:"👗",Outerwear:"🧥",Shoes:"👟",Accessories:"👜"}[c]||"👕");

/* ================= SNAP (AI identify) ================= */
function renderSnap(el){
  CURRENT.ai = null;
  el.innerHTML = `
    <div id="snap-pre">
      <div class="upload-zone" id="upload-zone" onclick="$('#file').click()">
        <div style="font-size:44px">📸</div>
        <b>Add a photo of your item</b>
        <p class="mut" style="margin:6px 0 0">Tap to take a photo or pick from your camera roll.<br>AI vision will identify brand, size, color & price range.</p>
      </div>
      <input type="file" id="file" accept="image/*" capture="environment" class="hidden" onchange="onPhoto(this)">
      <p class="mut" style="text-align:center;margin-top:12px">Prefer a sample? <a class="link" href="javascript:useSample()">Try a sample jacket</a></p>
    </div>
    <div id="snap-work" class="hidden"></div>`;
}
function onPhoto(inp){
  const f = inp.files[0]; if (!f) return;
  const img = new Image();
  const url = URL.createObjectURL(f);
  img.onload = () => {
    // downscale to 1024px max so base64 stays reasonable
    const scale = Math.min(1, 1024 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const b64 = c.toDataURL("image/jpeg", 0.85).split(",")[1];
    analyzeImage(b64, url);
  };
  img.src = url;
}
async function analyzeImage(b64, previewUrl){
  $("#snap-pre").classList.add("hidden");
  const w = $("#snap-work"); w.classList.remove("hidden");
  w.innerHTML = `<div class="card">${showLoader().split("</div>")[0]}<p style="text-align:center" class="mut">AI is looking at your item…</p></div>`;
  try {
    if (previewUrl) await new Promise(r=>{ onerror_v=null; });
    const d = await api("/api/ai/analyze", { method:"POST", body: JSON.stringify({ image: b64 }) });
    if (d.source === "error") throw new Error(d.error);
    CURRENT.ai = { ...d, _preview: previewUrl, _b64: b64 };
    w.innerHTML = aiResult(d, previewUrl);
  } catch(e){
    w.innerHTML = `<div class="card"><div class="empty" style="padding:12px"><b>🤖</b>Vision model had trouble: <br><span class="mut">${escapeHtml(e.message)}</span><br><br><button class="btn btn-soft btn-sm" onclick="renderSnap($('#screen'))">Try again</button></div></div>`;
  }
}
function aiResult(d, previewUrl){
  const cat = d.category || "Tops";
  return `<div class="card">

async function uploadB64(b64, name){
  try {
    const bin = atob(b64);
    const bytes = Uint8Array.from(bin.split("").map(ch=>ch.charCodeAt(0)));
    const blob = new Blob([bytes], { type: "image/jpeg" });
    const fd = new FormData();
    fd.append("file", blob, (name||"item").slice(0,40).replace(/[^a-z0-9]+/gi,"-") + ".jpg");
    const r = await fetch(API + "/api/images/upload", { method:"POST", headers:{ Authorization:"Bearer "+TOKEN }, body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error||"upload failed");
    return d.url;
  } catch(e){ console.error(e); return null; }
}

async function saveManual(){
  const body = { title: $("#m-title").value.trim(), price: parseFloat($("#m-price").value), size: $("#m-size").value.trim(), category: $("#m-cat .on").textContent, condition: $("#m-cond .on").textContent, description: $("#m-desc").value.trim(), photo_url: $("#m-photo").value.trim()||null };
  if (!body.title || !body.price) return toast("Title and price are required");
  try { await api("/api/listings", { method:"POST", body: JSON.stringify(body) }); closeSheet(); toast("Added ✓"); go("closet"); } catch(e){ toast(e.message); }
}

function openSheet(html){
  const el = document.createElement("div");
  el.className = "sheet"; el.id = "sheet";
  el.innerHTML = `<div class="body">${html}<br><button class="btn btn-soft" style="width:100%" onclick="closeSheet()">Close</button></div>`;
  el.addEventListener("click", e=>{ if (e.target===el) closeSheet(); });
  document.body.appendChild(el);
}
function closeSheet(){ const s = $("#sheet"); if (s) s.remove(); }

/* ================= utils ================= */
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return String(s??"").replace(/"/g,"&quot;"); }
function titleCase(s){ return String(s||"").replace(/\b\w/g, c=>c.toUpperCase()); }
async function loadMarketplaces(){
  if (!S.markets) { try { S.markets = (await api("/api/marketplaces")).marketplaces; } catch { S.markets = []; } }
}
async function useSample(){
  // pull a real, freely-hosted product photo of a jacket for the demo path
  try {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = img.width; c.height = img.height;
      c.getContext("2d").drawImage(img,0,0);
      const b64 = c.toDataURL("image/jpeg", .85).split(",")[1];
      analyzeImage(b64, img.src);
    };
    img.onerror = () => toast("Couldn't load sample — tap to take your own photo");
    img.src = "https://fashionistas-api.fashionistas1979.workers.dev/api/images/u/25/1790207326758-photo.jpg";
  } catch(e){ toast("Sample unavailable"); }
}
