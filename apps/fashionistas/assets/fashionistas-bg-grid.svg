<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="fa-grid-t fa-grid-d">
  <title id="fa-grid-t">Fashionistas dot field background</title>
  <desc id="fa-grid-d">Fine dot field with hairline column rules and a soft terracotta wash on ivory.</desc>
  <defs>
    <pattern id="fa-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#B9A996" fill-opacity="0.75"/>
    </pattern>
    <linearGradient id="fa-gbase" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F3ECE1"/>
    </linearGradient>
    <radialGradient id="fa-gwash">
      <stop offset="0" stop-color="#C84B31" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#C84B31" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#C84B31" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fa-gfade" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="fa-fademask">
      <rect width="1600" height="900" fill="url(#fa-gfade)"/>
    </mask>
  </defs>
  <rect width="1600" height="900" fill="url(#fa-gbase)"/>
  <rect width="1600" height="900" fill="url(#fa-dots)" mask="url(#fa-fademask)"/>
  <g stroke="#C4B7A6" stroke-opacity="0.55" stroke-width="1">
    <path d="M400 0V900"/>
    <path d="M800 0V900"/>
    <path d="M1200 0V900"/>
  </g>
  <ellipse cx="1440" cy="120" rx="520" ry="420" fill="url(#fa-gwash)"/>
  <ellipse cx="240" cy="860" rx="430" ry="330" fill="url(#fa-gwash)" opacity="0.7"/>
  <g fill="none" stroke="#1E1A18" stroke-opacity="0.1" stroke-width="1.5">
    <rect x="96" y="96" width="1408" height="708" rx="4"/>
  </g>
</svg>
