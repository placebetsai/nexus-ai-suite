      <path d="M12.6 2.8H4.6A1.8 1.8 0 0 0 2.8 4.6V12.6l8.7 8.7a1.7 1.7 0 0 0 2.4 0l7.4-7.4a1.7 1.7 0 0 0 0-2.4Z"/>
      <circle cx="7.2" cy="7.2" r="1.5"/>
    </g>
  </symbol>

  <symbol id="fi-camera" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9.5A2.5 2.5 0 0 1 5.5 7h1.8l1.4-2h6.6l1.4 2h1.8A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5Z"/>
      <circle cx="12" cy="13" r="3.6"/>
    </g>
  </symbol>

