<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" color="#1E1A18" role="img" aria-labelledby="fi-set-t fi-set-d">
  <title id="fi-set-t">Fashionistas icon set</title>
  <desc id="fi-set-d">Twelve 24 pixel stroke icons: tag, camera, hanger, price, truck, chart, storefront, shirt, ruler, search, bookmark, sliders. Use with a symbol reference such as assets/fashionistas-icons.svg#fi-tag.</desc>
  <symbol id="fi-tag" viewBox="0 0 24 24">
