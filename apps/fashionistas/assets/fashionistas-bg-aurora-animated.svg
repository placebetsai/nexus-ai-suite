<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="fa-aurora-a-t fa-aurora-a-d">
  <title id="fa-aurora-a-t">Fashionistas animated aurora background</title>
  <desc id="fa-aurora-a-d">The warm mesh gradient with a slow twenty four second drift. Identical composition to fashionistas-bg-aurora.svg when animation is disabled.</desc>
  <defs>
    <linearGradient id="faa-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCF7"/>
      <stop offset="0.52" stop-color="#FAF5EE"/>
      <stop offset="1" stop-color="#F2EADE"/>
    </linearGradient>
    <radialGradient id="faa-warm">
      <stop offset="0" stop-color="#C84B31" stop-opacity="0.36"/>
      <stop offset="0.5" stop-color="#C84B31" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#C84B31" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="faa-sand">
      <stop offset="0" stop-color="#E2A15C" stop-opacity="0.44"/>
      <stop offset="0.5" stop-color="#E2A15C" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#E2A15C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="faa-taupe">
      <stop offset="0" stop-color="#B79C7E" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#B79C7E" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#B79C7E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="faa-shade">
      <stop offset="0" stop-color="#5C4638" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5C4638" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#faa-base)"/>
  <ellipse cx="230" cy="130" rx="640" ry="520" fill="url(#faa-warm)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 95 60; 0 0" dur="24s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1570" cy="470" rx="620" ry="560" fill="url(#faa-sand)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -85 -50; 0 0" dur="28s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="330" cy="950" rx="640" ry="410" fill="url(#faa-taupe)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 75 -45; 0 0" dur="26s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1180" cy="940" rx="520" ry="300" fill="url(#faa-shade)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -65 -30; 0 0" dur="30s" repeatCount="indefinite"/>
  </ellipse>
  <g fill="none" stroke="#C84B31" stroke-opacity="0.15" stroke-width="1.5">
    <circle cx="1290" cy="170" r="290">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -22 16; 0 0" dur="32s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1290" cy="170" r="420">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -22 16; 0 0" dur="32s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
