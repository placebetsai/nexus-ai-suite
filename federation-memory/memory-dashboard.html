<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Federation Memory Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#12121a;--border:#1e1e2e;--accent:#6c5ce7;--accent2:#00cec9;--text:#e0e0e0;--muted:#888;--danger:#ff4757;--success:#2ed573}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1400px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--border);margin-bottom:20px}
h1{font-size:1.5rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:15px;text-align:center}
.stat-card .number{font-size:2rem;font-weight:bold;color:var(--accent)}
.stat-card .label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.main{display:grid;grid-template-columns:300px 1fr;gap:20px}
.sidebar{display:flex;flex-direction:column;gap:15px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:15px}
.panel h3{font-size:.9rem;color:var(--accent);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
input,textarea,button,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit;font-size:.9rem}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
button{cursor:pointer;border:none;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.8}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.8}
.btn-secondary{background:var(--border);color:var(--text)}.btn-secondary:hover{background:#2a2a3e}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{opacity:.8}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row button{flex:1}
.tag-cloud{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:4px 10px;border-radius:20px;font-size:.7rem;cursor:pointer;transition:all .2s;background:var(--border);color:var(--text)}
.tag:hover,.tag.active{background:var(--accent);color:#fff}
.tag-count{font-size:.6rem;opacity:.7;margin-left:3px}
.content{display:flex;flex-direction:column;gap:15px}
.timeline{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding-right:5px}
.timeline::-webkit-scrollbar{width:6px}
.timeline::-webkit-scrollbar-track{background:var(--bg)}
.timeline::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.memory-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:all .2s}
.memory-card:hover{border-color:var(--accent);transform:translateX(3px)}
.memory-card.selected{border-color:var(--accent2);background:#1a1a2e}
.memory-card .meta{display:flex;justify-content:space-between;margin-bottom:6px}
.memory-card .date{font-size:.7rem;color:var(--muted)}
.memory-card .tags{display:flex;gap:4px;flex-wrap:wrap}
.memory-card .tags span{font-size:.6rem;padding:2px 6px;background:var(--border);border-radius:10px}
.memory-card .preview{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;min-height:300px}
.detail h3{color:var(--accent2);margin-bottom:10px}
.detail .content{font-size:.95rem;line-height:1.6;margin-bottom:15px}
.detail .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.detail .tags span{padding:4px 12px;background:var(--accent);color:#fff;border-radius:20px;font-size:.75rem}
.detail .timestamp{color:var(--muted);font-size:.8rem}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-size:.85rem;z-index:1000;animation:slideIn .3s ease}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.empty{text-align:center;color:var(--muted);padding:40px;font-size:.9rem}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Federation Memory System</h1>
    <div class="btn-row">
      <button class="btn-success" onclick="exportMemories()">Export</button>
      <button class="btn-secondary" onclick="document.getElementById('importFile').click()">Import</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importMemories(event)">
    </div>
  </header>
  <div class="stats">
    <div class="stat-card"><div class="number" id="totalMem">0</div><div class="label">Total Memories</div></div>
    <div class="stat-card"><div class="number" id="totalTags">0</div><div class="label">Unique Tags</div></div>
    <div class="stat-card"><div class="number" id="todayCount">0</div><div class="label">Today</div></div>
    <div class="stat-card"><div class="number" id="oldestDate">-</div><div class="label">Oldest Memory</div></div>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="panel">
        <h3>Save Memory</h3>
        <textarea id="newContent" placeholder="Memory content..."></textarea>
        <input id="newTags" placeholder="Tags (comma separated)" style="margin-top:8px">
        <button class="btn-primary" style="margin-top:8px" onclick="saveMemory()">Save Memory</button>
      </div>
      <div class="panel">
        <h3>Search</h3>
        <input id="searchText" placeholder="Search content..." oninput="searchMemories()">
        <select id="searchTag" style="margin-top:8px" onchange="searchMemories()"><option value="">All Tags</option></select>
      </div>
      <div class="panel">
        <h3>Tag Cloud</h3>
        <div class="tag-cloud" id="tagCloud"></div>
      </div>
    </div>
    <div class="content">
      <div class="panel">
        <h3>Timeline</h3>
        <div class="timeline" id="timeline"><div class="empty">Loading memories...</div></div>
      </div>
      <div class="panel detail" id="detail">
        <h3>Memory Detail</h3>
        <p class="empty">Select a memory to view details</p>
      </div>
    </div>
  </div>
</div>

<script>
let memories = [];
let selectedId = null;

async function loadMemories() {
  const res = await fetch('/api/memory/list');
  memories = await res.json();
  renderAll();
}

function renderAll() {
  renderTimeline();
  renderTagCloud();
  renderStats();
  renderTagFilter();
}

function renderTimeline() {
  const tl = document.getElementById('timeline');
  const sorted = [...memories].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
  if (!sorted.length) { tl.innerHTML = '<div class="empty">No memories yet. Save one above!</div>'; return; }
  tl.innerHTML = sorted.map(m => `
    <div class="memory-card ${m.id===selectedId?'selected':''}" onclick="selectMemory('${m.id}')">
      <div class="meta"><span class="date">${new Date(m.timestamp).toLocaleDateString()}</span></div>
      <div class="tags">${m.tags.map(t=>`<span>${t}</span>`).join('')}</div>
      <div class="preview">${m.content.substring(0,100)}${m.content.length>100?'...':''}</div>
    </div>
  `).join('');
}

function renderTagCloud() {
  const tagMap = {};
  memories.forEach(m => m.tags.forEach(t => tagMap[t] = (tagMap[t]||0)+1));
  const cloud = document.getElementById('tagCloud');
  cloud.innerHTML = Object.entries(tagMap).sort((a,b)=>b[1]-a[1]).map(([tag,count])=>
    `<span class="tag" onclick="filterByTag('${tag}')">${tag}<span class="tag-count">${count}</span></span>`
  ).join('');
}

function renderStats() {
  document.getElementById('totalMem').textContent = memories.length;
  const tags = new Set(); memories.forEach(m=>m.tags.forEach(t=>tags.add(t)));
  document.getElementById('totalTags').textContent = tags.size;
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('todayCount').textContent = memories.filter(m=>m.timestamp.startsWith(today)).length;
  if (memories.length) {
    const oldest = [...memories].sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp))[0];
    document.getElementById('oldestDate').textContent = new Date(oldest.timestamp).toLocaleDateString();
  }
}

function renderTagFilter() {
  const tags = new Set(); memories.forEach(m=>m.tags.forEach(t=>tags.add(t)));
  const sel = document.getElementById('searchTag');
  sel.innerHTML = '<option value="">All Tags</option>' + [...tags].sort().map(t=>`<option value="${t}">${t}</option>`).join('');
}

function selectMemory(id) {
  selectedId = id;
  const m = memories.find(x=>x.id===id);
  if (!m) return;
  document.getElementById('detail').innerHTML = `
    <h3>Memory Detail</h3>
    <div class="tags">${m.tags.map(t=>`<span>${t}</span>`).join('')}</div>
    <div class="content">${m.content}</div>
    <div class="timestamp">Created: ${new Date(m.created).toLocaleString()} | Updated: ${new Date(m.timestamp).toLocaleString()}</div>
    <div class="btn-row" style="margin-top:15px">
      <button class="btn-danger" onclick="deleteMemory('${m.id}')">Delete</button>
    </div>`;
  renderTimeline();
}

async function saveMemory() {
  const content = document.getElementById('newContent').value.trim();
  if (!content) return toast('Content required','error');
  const tags = document.getElementById('newTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  await fetch('/api/memory/save', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content,tags}) });
  document.getElementById('newContent').value = '';
  document.getElementById('newTags').value = '';
  toast('Memory saved!','success');
  loadMemories();
}

async function deleteMemory(id) {
  await fetch('/api/memory/'+id, {method:'DELETE'});
  selectedId = null;
  document.getElementById('detail').innerHTML = '<h3>Memory Detail</h3><p class="empty">Select a memory to view details</p>';
  toast('Memory deleted','success');
  loadMemories();
}

async function searchMemories() {
  const text = document.getElementById('searchText').value;
  const tag = document.getElementById('searchTag').value;
  let url = '/api/memory/retrieve?';
  if (text) url += 'text='+encodeURIComponent(text)+'&';
  if (tag) url += 'tag='+encodeURIComponent(tag);
  const res = await fetch(url);
  memories = await res.json();
  renderTimeline();
  renderTagCloud();
  renderStats();
}

function filterByTag(tag) {
  document.getElementById('searchTag').value = tag;
  searchMemories();
}

async function exportMemories() {
  const res = await fetch('/api/memory/export', {method:'POST'});
  const data = await res.json();
  const blob = new Blob([JSON.stringify(data.memories,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'federation-memories-'+new Date().toISOString().split('T')[0]+'.json';
  a.click();
  toast('Exported!','success');
}

async function importMemories(e) {
  const file = e.target.files[0]; if (!file) return;
  const text = await file.text();
  const memories = JSON.parse(text);
  await fetch('/api/memory/import', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({memories})});
  toast('Imported '+memories.length+' memories!','success');
  loadMemories();
}

function toast(msg,type='success') {
  const t = document.createElement('div');
  t.className = 'toast '+type; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

loadMemories();
</script>
</body>
</html>
