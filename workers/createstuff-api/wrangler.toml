name = "createstuff-api"
main = "src/index.js"
compatibility_flags = ["global_fetch_strictly_public"]
compatibility_date = "2026-09-23"

# Two triggers, dispatched apart by event.cron inside scheduled():
#   */30 — the account-wide D1 read budget (5,000,000 rows/day shared by
#          MarketPicks, Fashionistas and CreateStuff) and the stale-build
#          watchdog. Both keep their original cadence.
#   */5  — owner-scheduled jobs, so "every 5 minutes" is a real promise.
# Runs on Cloudflare, not on the laptop, so the pot is watched even when this
# machine is asleep.
[triggers]
crons = ["*/30 * * * *", "*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "createstuff-db"
database_id = "cc9ab7ed-b343-4883-bf76-07f8493cba9e"

[[kv_namespaces]]
binding = "KV"
id = "e4f7f32a41494e4086e1ff6a1a901105"

# File storage for generated apps (avatars, uploads, assets). The bucket was
# created on 2026-09-22 but never bound, so no app could save a file — this is
# the binding that makes /app/:id/api/storage real. 10 GB free tier.
[[r2_buckets]]
binding = "FILES"
bucket_name = "createstuff-files"

# Not a secret (it is already public in marketpicks-ai/wrangler.toml), but the
# analytics token itself is a Worker secret: `wrangler secret put
# CF_ANALYTICS_TOKEN`. It is never written to this repository.
[vars]
# Builds call Groq from this Worker first; the laptop relay is only a fallback.
CLOUD_FIRST = "1"
# The laptop relay is off: builds run on Groq, then Workers AI, all from Cloudflare.
RELAY_OFF = "1"
CF_ACCOUNT_ID = "7eb89b01e9c3bec41ee24db8ecbe77f8"

[ai]
binding = "AI"
