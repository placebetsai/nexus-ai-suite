name = "federation-watch"
main = "src/index.js"
compatibility_date = "2026-09-23"
workers_dev = true

# No cron trigger: the free plan allows 5 per account and all are used.
# site-cron-trigger calls /tick every 15 minutes instead. With Workers Paid,
# restore: [triggers] crons = ["*/15 * * * *"]
[triggers]
crons = []

[vars]
CF_ACCOUNT_ID = "7eb89b01e9c3bec41ee24db8ecbe77f8"

[[kv_namespaces]]
binding = "STATE"
id = "1a57547540a5482aa1bc7607e600b4f2"

# Workers can't fetch another worker's *.workers.dev URL on the same account
# (it 404s), so the two API checks go through service bindings.
[[services]]
binding = "FASH_API"
service = "fashionistas-api"

[[services]]
binding = "CS_API"
service = "createstuff-api"
