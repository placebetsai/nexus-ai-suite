<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fashionistas Crosslister</title>
<style>
 body{width:300px;margin:0;font:13px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:#12121a;background:#fbf8f4}
 .w{padding:14px} h1{font-size:15px;margin:0 0 4px} p{margin:0 0 10px;color:#74747e}
 .job{background:#fff;border:1px solid #e7e1d8;border-radius:11px;padding:9px 10px;margin:6px 0}
 .job b{display:block} a,button{font:600 12px system-ui,sans-serif}
 button{border:1px solid #e7e1d8;background:#fff;border-radius:9px;padding:6px 10px;cursor:pointer}
 a.main{display:inline-block;background:#ff4e3a;color:#fff;text-decoration:none;border-radius:9px;padding:7px 11px}
</style></head>
<body><div class="w">
 <h1>Fashionistas Crosslister</h1>
 <p>Pick an item in Fashionistas, tick your shops, then press <b>Fill it for me</b>. Each shop opens with your listing filled in. You check it and press Post.</p>
 <div id="jobs"></div>
 <p style="margin-top:10px"><a class="main" href="https://fashionistas.ai/" target="_blank" title="Open Fashionistas to pick an item.">Open Fashionistas</a>
 <button id="clear" title="Forget every listing waiting to be filled.">Clear waiting</button></p>
</div><script src="popup.js"></script></body></html>
